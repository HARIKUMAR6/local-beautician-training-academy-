<script>
  /* Runs before first paint: applies the saved (or system) theme and saved direction so there is no flash. */
  (function () {
    var d = document.documentElement, t, r;
    try { t = localStorage.getItem('aca-theme'); r = localStorage.getItem('aca-dir'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') { t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    d.setAttribute('data-theme', t);
    d.setAttribute('dir', r === 'rtl' ? 'rtl' : 'ltr');
  })();
</script>
<script type="module" src="{{root}}assets/js/main.js"></script>
