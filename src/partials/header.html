<a class="skip-link" href="#main">Skip to main content</a>

<header class="site-header" data-site-header>
  <div class="site-header__bar container-wide">
    <!--@include brand-->

    <nav class="site-nav hidden xl:flex" aria-label="Primary">
      <ul class="nav-list">
        {{@nav-desktop}}
      </ul>
    </nav>

    <div class="site-header__actions">
      <button type="button" class="icon-btn hidden md:inline-grid" data-theme-toggle aria-label="Switch to dark theme">
        {{icon:sun theme-icon-sun}}{{icon:moon theme-icon-moon}}
      </button>

      <span class="hidden md:inline-flex"><!--@include dir-toggle--></span>

      <a class="btn btn-sm btn-outline hidden xl:inline-flex" href="{{root}}{{site.actions.login.href}}"{{@current:login}}>{{site.actions.login.label}}</a>
      <a class="btn btn-sm btn-primary hidden xl:inline-flex" href="{{root}}{{site.actions.enquire.href}}">{{site.actions.enquire.label}} {{icon:arrow-right icon-dir}}</a>

      <button type="button" class="icon-btn menu-btn xl:hidden" data-menu-toggle aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
        {{icon:menu}}
      </button>
    </div>
  </div>
</header>

<div class="mobile-menu" id="mobile-menu" role="dialog" aria-modal="true" aria-label="Main menu" data-mobile-menu hidden>
  <div class="mobile-menu__bar container-wide">
    <!--@include brand-->
    <div class="site-header__actions">
      <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch to dark theme">
        {{icon:sun theme-icon-sun}}{{icon:moon theme-icon-moon}}
      </button>
      <button type="button" class="icon-btn" data-menu-close aria-label="Close menu">
        {{icon:close}}
      </button>
    </div>
  </div>

  <div class="mobile-menu__body container-wide">
    <nav aria-label="Mobile">
      <ol class="m-list">
        {{@nav-mobile}}
      </ol>
    </nav>
  </div>

  <div class="mobile-menu__foot container-wide">
    <div class="mobile-menu__row md:hidden">
      <span class="folio">Layout</span>
      <!--@include dir-toggle-->
    </div>
    <a class="btn btn-outline btn-block" href="{{root}}{{site.actions.login.href}}">{{site.actions.login.label}}</a>
    <a class="btn btn-primary btn-block" href="{{root}}{{site.actions.enquire.href}}">{{site.actions.enquire.label}} {{icon:arrow-right icon-dir}}</a>
  </div>
</div>
