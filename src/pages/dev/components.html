<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <!--@include head-->
  <title>Component reference (dev only) | {{site.fullName}}</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- DEV ONLY: exists to exercise shared components (buttons, forms, scroll length). Delete before launch. -->
</head>
<body data-page="dev">
  <!--@include header-->

  <main id="main" tabindex="-1" class="container-x py-16">
    <p class="folio text-muted">Dev only</p>
    <h1 class="text-h1 mt-3">Component reference</h1>
    <p class="mt-4 max-w-[60ch] text-body-lg text-muted">Shared components only. This page is not part of the website and will be removed.</p>

    <section class="mt-16" aria-labelledby="btn-h">
      <h2 id="btn-h" class="text-h3">Buttons</h2>
      <div class="mt-6 flex flex-wrap items-center gap-4">
        <a class="btn btn-primary" href="#main">Primary {{icon:arrow-right icon-dir}}</a>
        <a class="btn btn-accent" href="#main">Accent</a>
        <a class="btn btn-outline" href="#main">Secondary</a>
        <a class="btn btn-link" href="#main">Text link</a>
        <button class="btn btn-primary" type="button" disabled>Disabled</button>
      </div>
      <div class="mt-4 flex flex-wrap items-center gap-4">
        <a class="btn btn-primary btn-sm" href="#main">Small</a>
        <a class="btn btn-primary" href="#main">Medium</a>
        <a class="btn btn-primary btn-lg" href="#main">Large</a>
      </div>
    </section>

    <section class="mt-16" aria-labelledby="form-h">
      <h2 id="form-h" class="text-h3">Form fields</h2>
      <form class="mt-6 grid max-w-xl gap-6" novalidate onsubmit="return false">
        <div class="field">
          <label class="field-label" for="f-name">Full name</label>
          <input class="input" id="f-name" type="text" placeholder="Your name" autocomplete="name">
          <span class="field-help">Helper text sits below the field.</span>
        </div>
        <div class="field">
          <label class="field-label" for="f-email">Email</label>
          <input class="input" id="f-email" type="email" value="not-an-email" aria-invalid="true" aria-describedby="f-email-err" dir="auto">
          <span class="field-error" id="f-email-err">{{icon:close}} Enter a valid email address.</span>
        </div>
        <div class="field">
          <label class="field-label" for="f-sel">Interested in</label>
          <div class="select">
            <select class="select-input" id="f-sel">
              <option>Select an option</option>
              <option>Option one</option>
              <option>Option two</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="f-msg">Message</label>
          <textarea class="textarea" id="f-msg" placeholder="Write here"></textarea>
        </div>
        <label class="check"><input type="checkbox" checked> <span>Checkbox option</span></label>
        <div><button class="btn btn-primary" type="submit">Submit</button></div>
      </form>
    </section>

    <div aria-hidden="true" style="height: 1400px"></div>
  </main>

  <!--@include footer-->
  <!--@include scroll-top-->
</body>
</html>
